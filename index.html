<style>
/* ── Caviar & Corndogs ────────────────────────────────────────────────
   The film carries the page. The mark and one line sit in a small bloom
   of ivory so they hold against moving footage, while the footage itself
   stays visible out to the edges. Palette and face from the Vision deck.
   ──────────────────────────────────────────────────────────────────── */
:root{
  --ivory: #f6f1e7;
  --ink:   #1e2a3a;
  --brass: #96793f;

  --serif: "Palatino Linotype", Palatino, "Book Antiqua", "EB Garamond",
           Georgia, "Times New Roman", serif;

  color-scheme: light;
}

*, *::before, *::after{ box-sizing: border-box; }

html, body{ height: 100%; }

body{
  margin: 0;
  background: var(--ivory);
  color: var(--ink);
  font-family: var(--serif);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ── The film ───────────────────────────────────────────────────────── */
.stage{ position: fixed; inset: 0; z-index: 0; overflow: hidden; background: var(--ivory); }

.stage img, .stage video{
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: 50% 50%;
  display: block;
}
@media (max-width: 700px){
  .stage img, .stage video{ object-position: 50% 38%; }
}

.stage video{ opacity: 0; transition: opacity 1.1s ease; }
.stage video.is-live{ opacity: 1; }

/* A small ivory bloom — enough ground for the mark, and nothing more, so
   the film is not fogged over. */
.wash{
  position: absolute; inset: 0;
  pointer-events: none;
  background:
    radial-gradient(34% 28% at 50% 55%,
      rgba(246,241,231,.70) 0%,
      rgba(246,241,231,.42) 46%,
      rgba(246,241,231,.10) 78%,
      rgba(246,241,231,0) 100%),
    linear-gradient(180deg,
      rgba(246,241,231,.18) 0%,
      rgba(246,241,231,.05) 38%,
      rgba(246,241,231,.20) 100%);
}

@media (max-width: 700px){
  .wash{
    background:
      radial-gradient(64% 26% at 50% 55%,
        rgba(246,241,231,.78) 0%,
        rgba(246,241,231,.52) 48%,
        rgba(246,241,231,.14) 80%,
        rgba(246,241,231,0) 100%),
      linear-gradient(180deg,
        rgba(246,241,231,.20) 0%,
        rgba(246,241,231,.08) 38%,
        rgba(246,241,231,.26) 100%);
  }
}

/* ── The mark ───────────────────────────────────────────────────────── */
.page{
  position: relative;
  z-index: 1;
  min-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-inline: 20px;
  /* Biased a little below centre: the footage carries its own house sign
     in the upper half of several shots. */
  padding-block: clamp(3rem, 13vh, 7.5rem) clamp(2rem, 7vh, 4.5rem);
}

.inner{
  width: 100%;
  max-width: 21rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: clamp(1.1rem, 2.6vh, 1.6rem);
}

.mark{ margin: 0; width: 100%; line-height: 0; }

.mark img{
  display: block;
  width: 100%;
  height: auto;
  /* drop-shadow follows the alpha channel, so the ivory halo hugs the
     letterforms and the tin rather than sitting in a box behind them. */
  filter:
    drop-shadow(0 0 8px rgba(246,241,231,.95))
    drop-shadow(0 0 22px rgba(246,241,231,.85));
}

.soon{
  margin: 0;
  font-size: clamp(.76rem, .72rem + .18vw, .84rem);
  letter-spacing: .34em;
  text-indent: .34em;   /* optical: recentre against the trailing track */
  text-transform: uppercase;
  color: var(--ink);
  text-shadow:
    0 0 10px rgba(246,241,231,.95),
    0 0 26px rgba(246,241,231,.75),
    0 1px 2px rgba(246,241,231,.9);
}

:focus-visible{ outline: 1px solid var(--brass); outline-offset: 3px; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>

<script>
/* ════════════════════════════════════════════════════════════════════
   SETUP — one line.

   Your film sits in this folder as hero.mp4. Leave this as-is unless you
   rename the file or move it to a CDN, in which case put the URL here.
   ════════════════════════════════════════════════════════════════════ */

const HERO_VIDEO = "hero.mp4";

/* ════════════════════════════════════════════════════════════════════ */

/* The poster is the film's own first frame, so there is no jump when the
   video takes over — and no empty rectangle if it never loads at all. */
(function initVideo(){
  if (!HERO_VIDEO) return;
  const v = document.getElementById("heroVideo");

  let shown = false;
  const reveal = () => {
    if (shown) return;
    shown = true;
    v.classList.add("is-live");
    const p = v.play();
    if (p && p.catch) p.catch(() => {});
  };

  // Whichever arrives first — browsers differ on which they fire.
  v.addEventListener("loadeddata", reveal, { once: true });
  v.addEventListener("canplay", reveal, { once: true });
  v.addEventListener("error", () => { shown = false; v.classList.remove("is-live"); });

  v.src = HERO_VIDEO;
  v.load();
})();
</script>
