<title>Caviar &amp; Corndogs</title>

<meta property="og:title" content="Caviar &amp; Corndogs">

<style>
/* ── Caviar & Corndogs ────────────────────────────────────────────────
   The film carries the page. Type sits in a bloom of ivory at the centre
   so the navy reads, while the footage stays visible out to the edges.
   Palette and face from the Vision deck; Palatino where the reader has
   it, EB Garamond otherwise.
   ──────────────────────────────────────────────────────────────────── */
:root{
  --ivory:    #f6f1e7;
  --ink:      #1e2a3a;
  --ink-soft: #46505c;
  --ink-mute: #6f6a5e;
  --rule:     #a89c85;
  --brass:    #96793f;

  --serif: "Palatino Linotype", Palatino, "Book Antiqua", "EB Garamond",
           Georgia, "Times New Roman", serif;

  --s--1: clamp(.76rem, .72rem + .18vw, .84rem);
  --s-0:  clamp(1rem, .96rem + .2vw, 1.08rem);

  color-scheme: light;
}

*, *::before, *::after{ box-sizing: border-box; }

html, body{ height: 100%; }

body{
  margin: 0;
  background: var(--ivory);
  color: var(--ink);
  font-family: var(--serif);
  font-size: var(--s-0);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ── The film ───────────────────────────────────────────────────────── */
.stage{ position: fixed; inset: 0; z-index: 0; overflow: hidden; background: var(--ivory); }

.stage img, .stage video{
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: 50% 50%;
  display: block;
}
@media (max-width: 700px){
  .stage img, .stage video{ object-position: 50% 38%; }
}
.stage video{ opacity: 0; transition: opacity 1.1s ease; }
.stage video.is-live{ opacity: 1; }

/* Ivory bloom: dense behind the type, thinning toward the edges so the
   footage keeps breathing. Two layers, not one flat veil. */
.wash{
  position: absolute; inset: 0;
  pointer-events: none;
  background:
    radial-gradient(56% 50% at 50% 60%,
      rgba(246,241,231,.86) 0%,
      rgba(246,241,231,.66) 42%,
      rgba(246,241,231,.26) 74%,
      rgba(246,241,231,.12) 100%),
    linear-gradient(180deg,
      rgba(246,241,231,.42) 0%,
      rgba(246,241,231,.20) 40%,
      rgba(246,241,231,.46) 100%);
}

@media (max-width: 700px){
  /* Portrait crops tighter, so the type needs more ground under it. */
  .wash{
    background:
      radial-gradient(82% 44% at 50% 60%,
        rgba(246,241,231,.92) 0%,
        rgba(246,241,231,.78) 46%,
        rgba(246,241,231,.34) 78%,
        rgba(246,241,231,.16) 100%),
      linear-gradient(180deg,
        rgba(246,241,231,.44) 0%,
        rgba(246,241,231,.26) 40%,
        rgba(246,241,231,.52) 100%);
  }
}

/* ── The word ───────────────────────────────────────────────────────── */
.page{
  position: relative;
  z-index: 1;
  min-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-inline: 20px;
  padding-block: clamp(4.5rem, 17vh, 10rem) clamp(2.5rem, 8vh, 5rem);
}

.inner{
  width: 100%;
  max-width: 25rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: clamp(1.6rem, 4.2vh, 2.5rem);
}

.mark{
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .42rem;
  font-weight: 400;
  color: var(--ink);
}

.crown{ display: block; width: 31px; height: auto; color: var(--brass); margin-bottom: .15rem; }

.mark-line{
  font-size: clamp(1.95rem, 8.6vw, 3.1rem);
  line-height: 1.02;
  letter-spacing: .1em;
  margin-inline-end: -.1em;  /* optical: absorb the trailing track */
  white-space: nowrap;
}

.mark-and{
  display: flex; align-items: center; gap: .7rem;
  width: 100%;
  font-size: var(--s--1);
  letter-spacing: .3em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.mark-and::before, .mark-and::after{
  content: ""; flex: 1 1 0; height: 1px; background: var(--rule);
}

.soon{
  margin: 0;
  font-size: var(--s--1);
  letter-spacing: .34em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

/* ── The list ───────────────────────────────────────────────────────── */
.signup{
  width: 100%;
  display: flex; flex-direction: column;
  align-items: center;
  gap: .7rem;
}

.signup-label{
  font-size: var(--s--1);
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--ink-mute);
}

.field{ display: flex; width: 100%; gap: .55rem; }

.field input{
  flex: 1 1 8rem; min-width: 0;
  font: inherit;
  color: var(--ink);
  background: rgba(246,241,231,.55);
  border: 0;
  border-bottom: 1px solid var(--rule);
  padding: .55rem .6rem;
  transition: border-color .2s ease, background .2s ease;
}
.field input::placeholder{ color: var(--ink-mute); font-style: italic; }
.field input:focus{
  outline: none;
  border-bottom-color: var(--ink);
  background: rgba(246,241,231,.8);
}

.field button{
  flex: 0 0 auto;
  font: inherit;
  font-size: var(--s--1);
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ivory);
  background: var(--ink);
  border: 1px solid var(--ink);
  border-radius: 0;
  padding: .62rem 1.25rem;
  cursor: pointer;
  transition: background .2s ease;
}
.field button:hover:not(:disabled){ background: #2c3c51; }
.field button:disabled{ opacity: .55; cursor: default; }

:focus-visible{ outline: 1px solid var(--brass); outline-offset: 3px; }

.status{
  margin: 0;
  min-height: 1.4em;
  font-size: var(--s--1);
  font-style: italic;
  color: var(--ink-soft);
}
.status[data-tone="bad"]{ color: #8a4438; }

.done{
  display: flex; flex-direction: column; gap: .25rem;
  padding-block: .4rem;
}
.done b{ font-weight: 400; font-style: italic; font-size: 1.24rem; }
.done span{ font-size: var(--s--1); color: var(--ink-soft); }

@media (max-width: 400px){
  .field{ flex-direction: column; }
  .field input{ flex: 0 0 auto; width: 100%; }
  .field button{ flex: 0 0 auto; width: 100%; }
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>

  <video id="heroVideo" autoplay muted loop playsinline preload="auto"></video>
  <div class="wash"></div>
</div>

<main class="page">
  <div class="inner">

    <h1 class="mark">
      <svg class="crown" viewBox="0 0 48 26" fill="none" aria-hidden="true">
        <path d="M4 22 L2 6 L13 14 L24 3 L35 14 L46 6 L44 22 Z"
              stroke="currentColor" stroke-width="1.4"
              stroke-linejoin="round" fill="none"/>
      </svg>
      <span class="mark-line">CAVIAR</span>
      <span class="mark-and">and</span>
      <span class="mark-line">CORNDOGS</span>
    </h1>

    <p class="soon">Opening soon</p>

    <form class="signup" id="signupForm" novalidate>
      <label class="signup-label" for="email">Join the list</label>
      <div class="field">
        <input id="email" name="email" type="email" inputmode="email"
               autocomplete="email" placeholder="your email" required>
        <button type="submit" id="submitBtn">Sign up</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>

  </div>
</main>

<script>
/* ════════════════════════════════════════════════════════════════════
   SETUP — two lines.
   ════════════════════════════════════════════════════════════════════ */

/* 1. The film. It sits in this folder; leave as-is unless you rename it. */
const HERO_VIDEO = "hero.mp4";

/* 2. Your Google Sheet endpoint. Paste the /exec URL you get when you
      deploy the Apps Script (see README, step 3). Leave "" and the form
      will say it isn't connected rather than swallowing addresses. */
const FORM_ENDPOINT = "";

/* ════════════════════════════════════════════════════════════════════ */

const PREVIEW = false;

/* The poster is the film's own first frame, so there is no jump when the
   video takes over — and no empty rectangle if it never loads. */
(function initVideo(){
  if (!HERO_VIDEO) return;
  const v = document.getElementById("heroVideo");

  let shown = false;
  const reveal = () => {
    if (shown) return;
    shown = true;
    v.classList.add("is-live");
    const p = v.play();
    if (p && p.catch) p.catch(() => {});
  };

  v.addEventListener("loadeddata", reveal, { once: true });
  v.addEventListener("canplay", reveal, { once: true });
  v.addEventListener("error", () => { shown = false; v.classList.remove("is-live"); });

  v.src = HERO_VIDEO;
  v.load();
})();

(function initSignup(){
  const form   = document.getElementById("signupForm");
  const input  = document.getElementById("email");
  const btn    = document.getElementById("submitBtn");
  const status = document.getElementById("status");

  const say = (msg, tone) => {
    status.textContent = msg;
    if (tone) status.setAttribute("data-tone", tone);
    else status.removeAttribute("data-tone");
  };

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = input.value.trim();

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
      say("That address doesn’t look quite right.", "bad");
      input.focus();
      return;
    }

    if (PREVIEW) {
      say("Preview only — the list is collected on the live site.", null);
      return;
    }

    if (!FORM_ENDPOINT) {
      say("Not connected yet — set FORM_ENDPOINT in the page source.", "bad");
      return;
    }

    btn.disabled = true;
    say("One moment…", null);

    try {
      /* text/plain keeps this a "simple" request, so the browser skips the
         CORS preflight that Apps Script cannot answer. The body is still
         JSON — the script parses it. */
      const res = await fetch(FORM_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ email: email, source: "caviarandcorndogs.com" })
      });
      if (!res.ok) throw new Error("HTTP " + res.status);

      form.innerHTML =
        '<div class="done">' +
          '<b>Thank you — you’re on the list.</b>' +
          '<span>We’ll be in touch when there is something to tell you.</span>' +
        '</div>';
    } catch (err) {
      btn.disabled = false;
      say("That didn’t go through. Please try again in a moment.", "bad");
    }
  });

  input.addEventListener("input", () => { if (status.textContent) say("", null); });
})();
</script>
